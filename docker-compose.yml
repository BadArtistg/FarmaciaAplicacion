version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: farmacia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-farmacia_db}
      POSTGRES_USER: ${DB_USER:-farmacia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farmacia_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: farmacia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: farmacia_app
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-farmacia_db}
      - DB_USER=${DB_USER:-farmacia_user}
      - DB_PASSWORD=${DB_PASSWORD:-farmacia_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - MODO_PRACTICA=True
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_volume:
